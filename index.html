<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tower Defense</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a2e;color:#eee;font-family:system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none}
#wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center;padding:16px;max-width:1280px;width:100%}
#game-area{position:relative}
canvas{display:block;border:2px solid #444;border-radius:4px;cursor:crosshair;background:#2d5a27}
#hud{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:6px;font-size:14px;line-height:1.6;pointer-events:none}
#wave-info{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.7);padding:8px 12px;border-radius:6px;font-size:14px;pointer-events:none}
#panel{background:#16213e;border-radius:8px;padding:16px;width:200px;flex-shrink:0}
#panel h3{font-size:14px;margin-bottom:12px;color:#aaa;text-transform:uppercase;letter-spacing:1px}
.tower-btn{display:flex;align-items:center;gap:10px;width:100%;padding:10px;margin-bottom:8px;background:#0f3460;border:2px solid transparent;border-radius:6px;color:#eee;cursor:pointer;font-size:13px;transition:border-color .15s}
.tower-btn:hover{border-color:#e94560}
.tower-btn.active{border-color:#53d769;background:#1a4a7a}
.tower-icon{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.tower-icon.archer{background:#4a90d9}
.tower-icon.mage{background:#9b59b6}
.tower-info{flex:1;text-align:left}
.tower-info .name{font-weight:600}
.tower-info .stats{font-size:11px;color:#aaa;margin-top:2px}
#bottom-bar{width:100%;max-width:716px;display:flex;justify-content:center;padding:8px 0}
#wave-btn{padding:12px 32px;font-size:16px;font-weight:600;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer;transition:background .15s,transform .1s}
#wave-btn:hover{background:#ff6b81}
#wave-btn:active{transform:scale(.97)}
#wave-btn:disabled{background:#555;cursor:not-allowed}
#menu{position:absolute;display:none;background:#16213e;border:2px solid #e94560;border-radius:8px;padding:8px;z-index:10;box-shadow:0 4px 20px rgba(0,0,0,.5)}
#menu button{display:block;width:100%;padding:8px 16px;margin:4px 0;background:#0f3460;color:#eee;border:none;border-radius:4px;cursor:pointer;font-size:13px;text-align:left}
#menu button:hover{background:#1a4a7a}
#menu .cancel{color:#aaa;font-size:12px;text-align:center;background:none}
#menu .cancel:hover{background:rgba(255,255,255,.05)}
#debug{display:none;position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.85);padding:10px 16px;z-index:100;font-size:12px;flex-wrap:wrap;gap:12px 24px;align-items:center}
#debug.show{display:flex}
#debug label{display:flex;align-items:center;gap:6px;white-space:nowrap}
#debug input[type=range]{width:100px}
#debug input[type=number]{width:60px;background:#333;border:1px solid #555;color:#eee;padding:2px 4px;border-radius:3px}
#debug-hint{position:fixed;top:4px;right:8px;font-size:11px;color:#666;z-index:99}
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:200;align-items:center;justify-content:center;flex-direction:column;gap:16px}
#overlay.show{display:flex}
#overlay h2{font-size:32px}
#overlay button{padding:12px 32px;font-size:16px;background:#e94560;color:#fff;border:none;border-radius:8px;cursor:pointer}
@media(max-width:740px){#wrap{flex-direction:column;align-items:center}#panel{width:100%;max-width:500px;display:flex;flex-wrap:wrap;gap:8px}#panel h3{width:100%}.tower-btn{width:calc(50% - 4px);margin:0}}
</style>
</head>
<body>
<div id="debug-hint">D — debug</div>
<div id="debug">
<label>Speed <input type="range" id="d-speed" min="0.5" max="5" step="0.1" value="1"><input type="number" id="d-speed-n" min="0.5" max="5" step="0.1" value="1"></label>
<label>Base HP <input type="range" id="d-hp" min="5" max="100" step="1" value="20"><input type="number" id="d-hp-n" min="5" max="100" value="20"></label>
<label>HP/wave <input type="range" id="d-hpg" min="0" max="20" step="0.5" value="7.5"><input type="number" id="d-hpg-n" min="0" max="20" step="0.5" value="7.5"></label>
<label>Archer $ <input type="number" id="d-acost" min="1" max="500" value="50"></label>
<label>Mage $ <input type="number" id="d-mcost" min="1" max="500" value="100"></label>
<label>Archer DMG <input type="number" id="d-admg" min="1" max="100" value="10"></label>
<label>Mage DMG <input type="number" id="d-mdmg" min="1" max="100" value="25"></label>
</div>
<div id="wrap">
<div id="game-area">
<canvas id="c" width="500" height="500"></canvas>
<div id="hud">💰 <span id="coins">100</span> &nbsp; ❤️ <span id="lives">10</span></div>
<div id="wave-info">Волна: <span id="wave-num">0</span></div>
<div id="menu"></div>
</div>
<div id="panel">
<h3>Башни</h3>
<button class="tower-btn" data-type="archer"><div class="tower-icon archer">🏹</div><div class="tower-info"><div class="name">Стрелок</div><div class="stats" id="archer-stats">DMG 10 · R 150 · $50</div></div></button>
<button class="tower-btn" data-type="mage"><div class="tower-icon mage">✨</div><div class="tower-info"><div class="name">Маг</div><div class="stats" id="mage-stats">DMG 25 · R 120 · $100</div></div></button>
<p style="font-size:11px;color:#666;margin-top:8px">Клик по клетке — меню.<br>Или выберите башню и кликните.</p>
</div>
</div>
<div id="bottom-bar"><button id="wave-btn">Следующая волна</button></div>
<div id="overlay"><h2 id="overlay-text">Game Over</h2><button id="restart-btn">Заново</button></div>
<script>
(function(){
'use strict';
const CELL=50,COLS=10,ROWS=10,W=COLS*CELL,H=ROWS*CELL;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

const cfg={
  enemySpeed:1,baseHp:20,hpPerWave:7.5,
  archer:{dmg:10,range:150,cost:50,rate:45},
  mage:{dmg:25,range:120,cost:100,rate:60,slow:0.5,slowDur:120},
  coinReward:10,waveSize:5,spawnInterval:30
};

// Path: zigzag rows 1-5
const pathCells=[];
for(let r=1;r<=5;r++){
  if(r%2===1)for(let c=0;c<COLS;c++)pathCells.push(c,r);
  else for(let c=COLS-1;c>=0;c--)pathCells.push(c,r);
}
const pathSet=new Set();
for(let i=0;i<pathCells.length;i+=2)pathSet.add(pathCells[i]+','+pathCells[i+1]);

const waypoints=[];
for(let i=0;i<pathCells.length;i+=2)
  waypoints.push({x:pathCells[i]*CELL+CELL/2,y:pathCells[i+1]*CELL+CELL/2});

function isPath(col,row){return pathSet.has(col+','+row)}

// Game state
let coins=100,lives=10,wave=0,gameOver=false;
let enemies=[],towers=[],projectiles=[];
let selectedCell=null,placementMode=null;
let waveActive=false,spawnQueue=[],spawnTimer=0;
let hoverCol=-1,hoverRow=-1;

function reset(){
  coins=100;lives=10;wave=0;gameOver=false;
  enemies=[];towers=[];projectiles=[];
  selectedCell=null;placementMode=null;
  waveActive=false;spawnQueue=[];spawnTimer=0;
  $('overlay').classList.remove('show');
  updateUI();
}

function enemyHp(w){return Math.round(cfg.baseHp+(w-1)*cfg.hpPerWave)}

function startWave(){
  if(waveActive||gameOver)return;
  wave++;
  waveActive=true;
  spawnQueue=[];
  for(let i=0;i<cfg.waveSize;i++)spawnQueue.push(enemyHp(wave));
  spawnTimer=0;
  $('wave-btn').disabled=true;
  updateUI();
}

function spawnEnemy(hp){
  enemies.push({hp,maxHp:hp,wp:0,x:waypoints[0].x,y:waypoints[0].y,slow:0,reward:cfg.coinReward});
}

function updateUI(){
  $('coins').textContent=coins;
  $('lives').textContent=lives;
  $('wave-num').textContent=wave;
  $('archer-stats').textContent='DMG '+cfg.archer.dmg+' · R '+cfg.archer.range+' · $'+cfg.archer.cost;
  $('mage-stats').textContent='DMG '+cfg.mage.dmg+' · R '+cfg.mage.range+' · $'+cfg.mage.cost;
  $('wave-btn').disabled=waveActive||gameOver;
}

// Tower placement
function canPlace(col,row){
  if(isPath(col,row))return false;
  return !towers.some(t=>t.col===col&&t.row===row);
}

function placeTower(type,col,row){
  const c=cfg[type];
  if(coins<c.cost)return false;
  coins-=c.cost;
  towers.push({type,col,row,x:col*CELL+CELL/2,y:row*CELL+CELL/2,cooldown:0});
  return true;
}

function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return dx*dx+dy*dy}

function findTarget(tower,range){
  let best=null,bestD=range*range;
  for(const e of enemies){
    const d=dist(tower,e);
    if(d<bestD){bestD=d;best=e}
  }
  return best;
}

function update(){
  if(gameOver)return;

  // Spawning
  if(waveActive&&spawnQueue.length){
    if(spawnTimer<=0){
      spawnEnemy(spawnQueue.shift());
      spawnTimer=cfg.spawnInterval;
    }else spawnTimer--;
  }

  // Enemies
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    const spd=cfg.enemySpeed*(e.slow>0?0.5:1);
    if(e.slow>0)e.slow--;

    if(e.wp>=waypoints.length-1){
      const last=waypoints[waypoints.length-1];
      const dx=last.x-e.x,dy=last.y-e.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<=spd){enemies.splice(i,1);lives--;if(lives<=0){lives=0;gameOver=true;$('overlay-text').textContent='Game Over';$('overlay').classList.add('show')}updateUI();continue}
      e.x+=dx/d*spd;e.y+=dy/d*spd;
    }else{
      const tgt=waypoints[e.wp+1];
      const dx=tgt.x-e.x,dy=tgt.y-e.y,d=Math.sqrt(dx*dx+dy*dy);
      if(d<=spd){e.x=tgt.x;e.y=tgt.y;e.wp++}
      else{e.x+=dx/d*spd;e.y+=dy/d*spd}
    }
  }

  // Towers shoot
  for(const t of towers){
    if(t.cooldown>0){t.cooldown--;continue}
    const c=cfg[t.type];
    const target=findTarget(t,c.range);
    if(target){
      projectiles.push({x:t.x,y:t.y,tx:target.x,ty:target.y,target,dmg:c.dmg,type:t.type,speed:6,
        slow:t.type==='mage'?c.slow:0,slowDur:t.type==='mage'?c.slowDur:0});
      t.cooldown=cfg[t.type].rate;
    }
  }

  // Projectiles
  for(let i=projectiles.length-1;i>=0;i--){
    const p=projectiles[i];
    if(!enemies.includes(p.target)){projectiles.splice(i,1);continue}
    p.tx=p.target.x;p.ty=p.target.y;
    const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.sqrt(dx*dx+dy*dy);
    if(d<=p.speed){
      p.target.hp-=p.dmg;
      if(p.slow)p.target.slow=Math.max(p.target.slow,p.slowDur);
      if(p.target.hp<=0){
        coins+=p.target.reward;
        const idx=enemies.indexOf(p.target);
        if(idx>=0)enemies.splice(idx,1);
      }
      projectiles.splice(i,1);
    }else{p.x+=dx/d*p.speed;p.y+=dy/d*p.speed}
  }

  // Wave end
  if(waveActive&&!spawnQueue.length&&!enemies.length){
    waveActive=false;
    $('wave-btn').disabled=false;
  }
  updateUI();
}

function drawGrid(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    ctx.fillStyle=isPath(c,r)?'#b0b0a8':'#3a7a33';
    ctx.fillRect(c*CELL,r*CELL,CELL,CELL);
    ctx.strokeStyle='rgba(0,0,0,.12)';ctx.strokeRect(c*CELL,r*CELL,CELL,CELL);
  }
  // Entry/exit markers
  ctx.fillStyle='#53d769';ctx.font='10px sans-serif';ctx.textAlign='center';
  ctx.fillText('▶',CELL/2,pathCells[1]*CELL+CELL/2+4);
  ctx.fillText('▶',(COLS-1)*CELL+CELL/2,pathCells[pathCells.length-1]*CELL+CELL/2+4);
}

function drawSelection(){
  if(selectedCell){
    const[c,r]=selectedCell;
    ctx.strokeStyle='#ffd700';ctx.lineWidth=3;
    ctx.strokeRect(c*CELL+2,r*CELL+2,CELL-4,CELL-4);
  }
  if(hoverCol>=0&&hoverRow>=0&&!isPath(hoverCol,hoverRow)&&canPlace(hoverCol,hoverRow)){
    ctx.fillStyle=placementMode?'rgba(83,215,105,.25)':'rgba(255,255,255,.12)';
    ctx.fillRect(hoverCol*CELL,hoverRow*CELL,CELL,CELL);
  }
}

function drawTowers(){
  for(const t of towers){
    ctx.beginPath();
    ctx.arc(t.x,t.y,16,0,Math.PI*2);
    ctx.fillStyle=t.type==='archer'?'#4a90d9':'#9b59b6';
    ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='14px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(t.type==='archer'?'🏹':'✨',t.x,t.y);
    // range circle when hovering
    if(hoverCol===t.col&&hoverRow===t.row){
      ctx.beginPath();ctx.arc(t.x,t.y,cfg[t.type].range,0,Math.PI*2);
      ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;ctx.stroke();
    }
  }
}

function drawEnemies(){
  for(const e of enemies){
    ctx.beginPath();ctx.arc(e.x,e.y,14,0,Math.PI*2);
    ctx.fillStyle=e.slow>0?'#ff8888':'#e94560';ctx.fill();
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(Math.ceil(e.hp),e.x,e.y);
    // hp bar
    const bw=24,bh=3,bx=e.x-bw/2,by=e.y-20;
    ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#53d769';ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
  }
}

function drawProjectiles(){
  for(const p of projectiles){
    ctx.beginPath();ctx.arc(p.x,p.y,4,0,Math.PI*2);
    ctx.fillStyle=p.type==='archer'?'#ffd700':'#c39bd3';ctx.fill();
  }
}

function render(){
  ctx.clearRect(0,0,W,H);
  drawGrid();drawSelection();drawTowers();drawEnemies();drawProjectiles();
}

function loop(){update();render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

// Input
function cellFromEvent(e){
  const rect=canvas.getBoundingClientRect();
  const scaleX=canvas.width/rect.width,scaleY=canvas.height/rect.height;
  const x=(e.clientX-rect.left)*scaleX,y=(e.clientY-rect.top)*scaleY;
  return[Math.floor(x/CELL),Math.floor(y/CELL)];
}

const menu=$('menu');
function showMenu(col,row,mx,my){
  if(!canPlace(col,row))return;
  selectedCell=[col,row];
  menu.innerHTML=
    '<button data-t="archer">🏹 Стрелок ($'+cfg.archer.cost+')</button>'+
    '<button data-t="mage">✨ Маг ($'+cfg.mage.cost+')</button>'+
    '<button class="cancel">Отмена</button>';
  const ga=document.getElementById('game-area').getBoundingClientRect();
  menu.style.display='block';
  menu.style.left=Math.min(mx-ga.left,W-120)+'px';
  menu.style.top=Math.min(my-ga.top+8,H-80)+'px';
}

function hideMenu(){menu.style.display='none';selectedCell=null}

canvas.addEventListener('mousemove',e=>{
  [hoverCol,hoverRow]=cellFromEvent(e);
});
canvas.addEventListener('mouseleave',()=>{hoverCol=hoverRow=-1});

canvas.addEventListener('click',e=>{
  if(gameOver)return;
  const[col,row]=cellFromEvent(e);
  if(placementMode&&canPlace(col,row)){
    if(placeTower(placementMode,col,row)){
      placementMode=null;
      document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('active'));
    }
    hideMenu();return;
  }
  if(canPlace(col,row))showMenu(col,row,e.clientX,e.clientY);
  else hideMenu();
});

menu.addEventListener('click',e=>{
  const btn=e.target.closest('button');
  if(!btn||!selectedCell)return;
  if(btn.classList.contains('cancel')){hideMenu();return}
  const type=btn.dataset.t;
  if(type&&placeTower(type,selectedCell[0],selectedCell[1]))hideMenu();
});

document.querySelectorAll('.tower-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const type=btn.dataset.type;
    if(placementMode===type){placementMode=null;btn.classList.remove('active')}
    else{placementMode=type;document.querySelectorAll('.tower-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');hideMenu()}
  });
});

$('wave-btn').addEventListener('click',startWave);
$('restart-btn').addEventListener('click',reset);

// Debug panel
const debug=$('debug');
document.addEventListener('keydown',e=>{
  if(e.key==='d'||e.key==='D'||e.key==='в'||e.key==='В')debug.classList.toggle('show');
});

function linkDebug(rangeId,numId,cb){
  const r=$(rangeId),n=$(numId);
  r.addEventListener('input',()=>{n.value=r.value;cb(+r.value)});
  n.addEventListener('change',()=>{r.value=n.value;cb(+n.value)});
}
linkDebug('d-speed','d-speed-n',v=>cfg.enemySpeed=v);
linkDebug('d-hp','d-hp-n',v=>cfg.baseHp=v);
linkDebug('d-hpg','d-hpg-n',v=>cfg.hpPerWave=v);
['d-acost','d-mcost','d-admg','d-mdmg'].forEach(id=>{
  $(id).addEventListener('change',()=>{
    cfg.archer.cost=+$('d-acost').value;
    cfg.mage.cost=+$('d-mcost').value;
    cfg.archer.dmg=+$('d-admg').value;
    cfg.mage.dmg=+$('d-mdmg').value;
    updateUI();
  });
});

updateUI();
})();
</script>
</body>
</html>
